name: Deploy Laravel to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.203.207.71
          username: ubuntu
          key: ${{ secrets.CI_CD_EC2 }}
          script: |
            # Update system
            sudo apt update -y
            sudo apt upgrade -y

            # Install PHP 8.2 + extensions
            sudo apt install -y software-properties-common
            sudo add-apt-repository ppa:ondrej/php -y
            sudo apt update -y
            sudo apt install -y php8.2 php8.2-cli php8.2-common php8.2-mysql php8.2-xml php8.2-mbstring php8.2-bcmath php8.2-curl php8.2-fpm unzip git curl nginx composer

            # Ensure services are enabled
            sudo systemctl enable php8.2-fpm
            sudo systemctl enable nginx

            # Create Laravel directory if not exists
            if [ ! -d "/var/www/laravel-app" ]; then
              sudo mkdir -p /var/www/laravel-app
              sudo chown -R ubuntu:ubuntu /var/www/laravel-app
            fi
            cd /var/www/laravel-app

            # Deploy code (clone or pull)
            if [ ! -d ".git" ]; then
              git clone https://github.com/TalhaHabib088/ci-cd-deployement.git .
            else
              git reset --hard
              git pull origin main
            fi

            # Install dependencies
            composer install --no-interaction --prefer-dist --optimize-autoloader

            # Setup Laravel environment
            if [ ! -f ".env" ]; then
              cp .env.example .env
              php artisan key:generate
            fi

            # Run migrations
            php artisan migrate --force

            # Optimize caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Set permissions
            sudo chown -R www-data:www-data /var/www/laravel-app
            sudo chmod -R 775 /var/www/laravel-app/storage /var/www/laravel-app/bootstrap/cache

            # Configure Nginx for Laravel
            LARAVEL_CONF="/etc/nginx/sites-available/laravel"
            if [ ! -f "$LARAVEL_CONF" ]; then
              sudo tee $LARAVEL_CONF > /dev/null <<EOL
              server {
                  listen 80;
                  server_name _;
                  root /var/www/laravel-app/public;

                  index index.php index.html index.htm;

                  location / {
                      try_files \$uri \$uri/ /index.php?\$query_string;
                  }

                  location ~ \.php\$ {
                      include snippets/fastcgi-php.conf;
                      fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
                      fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                      include fastcgi_params;
                  }

                  location ~ /\.ht {
                      deny all;
                  }
              }
              EOL
              sudo ln -s /etc/nginx/sites-available/laravel /etc/nginx/sites-enabled/
              sudo rm -f /etc/nginx/sites-enabled/default
            fi

            # Restart services
            sudo systemctl restart php8.2-fpm
            sudo systemctl restart nginx
